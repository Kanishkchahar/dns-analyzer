[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dns-analyzer"
version = "2.2.0"
description = "DNS, email, TLS, and web security posture scanner"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0,<1.0.0",
  "uvicorn[standard]>=0.28.0,<1.0.0",
  "dnspython>=2.6.0,<3.0.0",
  "cryptography>=42.0.0,<51.0.0",
  "pydantic>=2.6.0,<3.0.0",
  "jinja2>=3.1.3,<4.0.0",
  "markupsafe>=2.1.0,<4.0.0",
  "httpx>=0.27.0,<1.0.0",
  "httpcore>=1.0.0,<2.0.0",
  "defusedxml>=0.7.1,<1.0.0",
  "setuptools>=68",
]

[project.scripts]
dns-analyzer = "app.cli:main"

[project.entry-points."dns_analyzer.checks"]
domain_lifecycle = "app.checks.domain_lifecycle:register"
extended_security = "app.checks.extended_security:register"

[tool.setuptools]
packages = ["app", "app.data", "app.checks"]

[tool.setuptools.package-data]
"app.data" = ["*.json"]

[tool.setuptools.data-files]
static = ["static/index.html", "static/app.js", "static/style.css"]

[tool.ruff]
cache-dir = "/tmp/.ruff_cache"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

